[package]
name = "snowview"
version = "0.13.0"
description = "SnowView: monitor de nieve para estaciones de esquí"
authors = ["Yurik"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "snowview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
