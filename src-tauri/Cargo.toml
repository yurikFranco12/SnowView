[package]
name = "snowview"
version = "1.1.0"
description = "SnowView: monitor de nieve para estaciones de esquí"
authors = ["Yurik"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "snowview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

# Solo escritorio: la bandeja del sistema y el arranque con Windows no existen en Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"

# Versión de producción: binario más pequeño (importa en el AAB de Google Play) y sin símbolos.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
